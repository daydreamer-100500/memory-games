<!DOCTYPE html>
<html lang="uk">
<head>

<title>Подібність і коло: розв'язки 26–30</title>
<style>
:root{
  --bg:#fff8ef; --card:#fff; --ink:#2b2350; --muted:#7a7399;
  --pink:#ff4f8b; --orange:#ff9f1c; --yellow:#ffd23f; --green:#2ec4b6; --lime:#7bd84a;
  --blue:#3a86ff; --violet:#8338ec; --red:#ef476f;
  --shadow:0 6px 0 rgba(43,35,80,.12), 0 12px 28px rgba(43,35,80,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);line-height:1.45;
  background:radial-gradient(circle at 10% 0%,#ffe3f1 0,transparent 40%),radial-gradient(circle at 90% 10%,#dff3ff 0,transparent 40%),var(--bg);
  -webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;max-width:1040px;margin:0 auto}
h1{margin:0;font-size:22px}
h1 .acc{color:var(--pink)}
.home{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;font-size:22px;flex:none}
.btn{display:inline-block;border:0;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;box-shadow:var(--shadow);text-decoration:none;text-align:center}
.btn.go{background:var(--green)}
.btn.pink{background:var(--pink)}
.btn.light{background:#fff;color:var(--ink)}
header .btn{flex:none;padding:10px 12px}
header h1{flex:1}
nav{position:sticky;top:0;z-index:5;background:rgba(255,248,239,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
nav .in{display:flex;gap:8px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:10px 16px;scrollbar-width:none}
nav .in::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;background:#fff;border:2px solid var(--c,#e2dcf5);border-radius:999px;padding:6px 12px;white-space:nowrap}
main{max-width:1040px;margin:0 auto;padding:6px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.hero{margin:8px 0 18px}
.hero ol{margin:6px 0 10px;padding-left:22px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .row .btn{flex:1;min-width:150px}
/* group */
section.grp{margin:26px 0}
.band{background:var(--c);color:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.band .em{font-size:40px;line-height:1;background:#fff;border-radius:16px;padding:8px}
.band h2{margin:0;font-size:22px}
.band .k{opacity:.9;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.band p{margin:4px 0 0;font-size:15px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}}
.fc{border-top:8px solid var(--c);display:flex;flex-direction:column}
.fc h3{margin:0 0 4px;font-size:19px;display:flex;gap:8px;align-items:center}
.fc h3 .n{background:var(--c);color:#fff;border-radius:10px;padding:2px 8px;font-size:13px}
.formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(21px,6vw,30px);text-align:center;background:#f6f2ff;border:3px dashed var(--c);border-radius:18px;padding:12px 8px;margin:8px 0;line-height:1.5;cursor:pointer;position:relative}
.formula .line{display:block}
.fig{display:block;width:100%;max-width:260px;margin:4px auto;height:auto}
.it{display:flex;gap:8px;margin:6px 0;font-size:15.5px}
.it>b:first-child{flex:none;width:24px;text-align:center}
.it.fix{background:#ffe3ea;border:2px solid var(--red);border-radius:12px;padding:8px}
.it.mem{background:#fff4d6;border-radius:12px;padding:8px}
details{margin:6px 0;font-size:15px;background:#f3f0fa;border-radius:12px;padding:8px 10px}
summary{cursor:pointer;font-weight:700}
.grp .after{margin-top:14px;text-align:center}
/* math */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}
.rt{white-space:nowrap}
.rt>span{border-top:2px solid currentColor;padding:0 2px;margin-left:1px}
/* self-test: hide formulas */
body.test .formula>*{visibility:hidden}
body.test .formula::after{content:"👆 Скажи формулу вголос і торкнись";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 16px system-ui;color:var(--muted)}
body.test .formula.show>*{visibility:visible}
body.test .formula.show::after{content:none}
.toggle{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;padding:10px 14px;font-size:15px;opacity:.95}
/* pick table */
table{width:100%;border-collapse:collapse;font-size:15.5px}
td{padding:9px 8px;border-bottom:1px solid #eee;vertical-align:middle}
td:first-child{width:55%}
td .ans{font-weight:800;color:var(--c)}
td a{text-decoration:none}
/* links */
.links{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.links{grid-template-columns:1fr 1fr}}
.lk .ab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.lk .ab span{background:#f1e8ff;border-radius:10px;padding:4px 10px}
.lk .ab i{font-style:normal;font-size:20px;color:var(--pink)}
.lk p{margin:8px 0 0;font-size:15px}
svg text{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;fill:#2b2350}
/* worked tasks */
.task{border-top:8px solid var(--c);margin-top:14px}
.task h3{margin:0 0 6px;font-size:19px;display:flex;gap:8px;align-items:center}
.task h3 .n{background:var(--c);color:#fff;border-radius:10px;padding:2px 10px;font-size:14px}
.tq{font-size:16.5px;font-weight:600;margin:4px 0 8px}
.steps{margin:10px 0;padding-left:26px;font-size:16px}
.steps li{margin:8px 0;display:none}
.steps li.on{display:list-item;animation:pop .3s}
.steps li::marker{font-weight:800;color:var(--c)}
.ansbox{display:none;background:#d9fbf2;border:3px solid var(--green);border-radius:14px;padding:10px 12px;font-size:17px;margin:8px 0}
.task.done .ansbox{display:block}
.task.done .sbtn{display:none}
.task:not(.done) .check{display:none}
.sbtn{display:flex;gap:10px;margin-top:8px}
.sbtn .btn{flex:1}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{text-align:center;margin:30px 0 70px}
main{padding-bottom:90px}
</style>
</head>
<body>
<header>
  <a class="home" href="../" title="Усі ігри">🏠</a>
  <h1>✍️ <span class="acc">Розв'язки</span> 26–30</h1>
  <a class="btn" href="theory.html">📖 Теорія</a>
  <a class="btn pink" href="./">🎮 Гра</a>
</header>
<nav><div class="in" id="nav"></div></nav>
<main id="main"></main>
<script>
"use strict";
/* ---------- math helpers ---------- */
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const rt = x => `<span class="rt">√<span>${x}</span></span>`;
const L = (...lines) => lines.map(l => `<span class="line">${l}</span>`).join("");

/* ---------- svg helpers ---------- */
const P = pts => pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
const svg = (w, h, body) => `<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const poly = (pts, fill = "#fff3c4", stroke = "#2b2350") => `<polygon points="${P(pts)}" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`;
const ln = (a, b, col = "#2b2350", w = 3, dash = "") => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""} stroke-linecap="round"/>`;
const tx = (p, s, col = "#2b2350", size = 15) => `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" style="fill:${col};font-size:${size}px">${s}</text>`;
const cir = (c, r, col = "#8338ec", fill = "none", dash = "") => `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" stroke="${col}" stroke-width="2.5" fill="${fill}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
const dot = (p, col = "#2b2350") => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}"/>`;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function arc(v, a, b, r = 22, col = "#ff4f8b"){
  const u = lerp(v, a, r / dist(v, a)), w = lerp(v, b, r / dist(v, b));
  const cross = (a[0] - v[0]) * (b[1] - v[1]) - (a[1] - v[1]) * (b[0] - v[0]);
  return `<path d="M${u[0].toFixed(1)},${u[1].toFixed(1)} A${r},${r} 0 0 ${cross > 0 ? 1 : 0} ${w[0].toFixed(1)},${w[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="3"/>`;
}
function square(v, a, b, s = 12){
  const u = lerp(v, a, s / dist(v, a)), w = lerp(v, b, s / dist(v, b));
  const c = [u[0] + w[0] - v[0], u[1] + w[1] - v[1]];
  return `<polyline points="${P([u, c, w])}" fill="none" stroke="#2b2350" stroke-width="2"/>`;
}
function tick(a, b, n = 1, col = "#2b2350"){
  const m = mid(a, b), d = dist(a, b), ux = (b[0] - a[0]) / d, uy = (b[1] - a[1]) / d;
  let s = "";
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 6, c = [m[0] + ux * off, m[1] + uy * off];
    s += ln([c[0] - uy * 7, c[1] + ux * 7], [c[0] + uy * 7, c[1] - ux * 7], col, 2.5);
  }
  return s;
}
function incircle(A, B, C){
  const a = dist(B, C), b = dist(C, A), c = dist(A, B), p = a + b + c;
  const I = [(a * A[0] + b * B[0] + c * C[0]) / p, (a * A[1] + b * B[1] + c * C[1]) / p];
  const s = Math.abs((B[0] - A[0]) * (C[1] - A[1]) - (C[0] - A[0]) * (B[1] - A[1])) / 2;
  return [I, 2 * s / p];
}
function foot(P0, A, B){
  const dx = B[0] - A[0], dy = B[1] - A[1], t = ((P0[0] - A[0]) * dx + (P0[1] - A[1]) * dy) / (dx * dx + dy * dy);
  return [A[0] + t * dx, A[1] + t * dy];
}
const onC = (O, r, deg) => [O[0] + r * Math.cos(deg * Math.PI / 180), O[1] - r * Math.sin(deg * Math.PI / 180)];
const lab = (O, p, s, col = "#2b2350", k = 1.2) => tx(lerp(O, p, k), s, col);
function cross(a, b, c, d){
  const den = (a[0] - b[0]) * (c[1] - d[1]) - (a[1] - b[1]) * (c[0] - d[0]);
  const t = ((a[0] - c[0]) * (c[1] - d[1]) - (a[1] - c[1]) * (c[0] - d[0])) / den;
  return lerp(a, b, t);
}
function hits(A, P0, O, r){
  const L = dist(A, P0), u = [(P0[0] - A[0]) / L, (P0[1] - A[1]) / L], f = [A[0] - O[0], A[1] - O[1]];
  const b = f[0] * u[0] + f[1] * u[1], disc = Math.sqrt(b * b - (f[0] * f[0] + f[1] * f[1] - r * r));
  return [-b - disc, -b + disc].map(t => [A[0] + u[0] * t, A[1] + u[1] * t]);
}
function touch(A, O, r, side = 1){
  const phi = Math.atan2(A[1] - O[1], A[0] - O[0]), al = Math.acos(r / dist(A, O)) * side;
  return [O[0] + r * Math.cos(phi + al), O[1] + r * Math.sin(phi + al)];
}
function circum(A, B, C){
  const d = 2 * (A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
  const s = p => p[0] * p[0] + p[1] * p[1];
  const O = [(s(A) * (B[1] - C[1]) + s(B) * (C[1] - A[1]) + s(C) * (A[1] - B[1])) / d, (s(A) * (C[0] - B[0]) + s(B) * (A[0] - C[0]) + s(C) * (B[0] - A[0])) / d];
  return [O, dist(O, A)];
}
const fillC = (O, r) => cir(O, r, "#8338ec", "#f6f2ff");

/* ---------- figures ---------- */
const FIG = {};
const CO = [120, 90], CR = 70;
FIG.chords = () => { const A = onC(CO, CR, 165), B = onC(CO, CR, -20), C = onC(CO, CR, 215), D = onC(CO, CR, 70), M = cross(A, B, C, D);
  return svg(240, 180, fillC(CO, CR) + ln(A, B, "#3a86ff", 4) + ln(C, D, "#ff4f8b", 4) + [A, B, C, D].map(p => dot(p)).join("") + dot(M, "#8338ec")
    + lab(CO, A, "A") + lab(CO, B, "B") + lab(CO, C, "C") + lab(CO, D, "D") + tx([M[0] + 4, M[1] + 16], "M", "#8338ec")); };
FIG.simChord = () => { const A = onC(CO, CR, 165), B = onC(CO, CR, -20), C = onC(CO, CR, 215), D = onC(CO, CR, 70), M = cross(A, B, C, D);
  return svg(240, 180, fillC(CO, CR) + poly([A, M, C], "#d9fbf2", "#2ec4b6") + poly([D, M, B], "#ffe3f1", "#ff4f8b") + ln(A, B, "#2b2350", 3) + ln(C, D, "#2b2350", 3)
    + arc(A, M, C, 18, "#ff9f1c") + arc(D, M, B, 18, "#ff9f1c")
    + lab(CO, A, "A") + lab(CO, B, "B") + lab(CO, C, "C") + lab(CO, D, "D") + tx([M[0] + 4, M[1] + 16], "M", "#8338ec")); };
FIG.chordR = () => { const A = onC(CO, CR, 150), B = onC(CO, CR, 30), M = lerp(A, B, 0.35), u = [(M[0] - CO[0]) / dist(M, CO), (M[1] - CO[1]) / dist(M, CO)];
  const D = [CO[0] + u[0] * CR, CO[1] + u[1] * CR], C = [CO[0] - u[0] * CR, CO[1] - u[1] * CR];
  return svg(240, 200, fillC(CO, CR) + ln(C, D, "#2ec4b6", 3, "7 5") + ln(A, B, "#3a86ff", 4) + ln(CO, M, "#ff4f8b", 4)
    + [A, B, C, D].map(p => dot(p)).join("") + dot(CO, "#8338ec") + dot(M, "#ff4f8b")
    + lab(CO, A, "A") + lab(CO, B, "B") + lab(CO, C, "C", "#2ec4b6") + lab(CO, D, "D", "#2ec4b6") + tx([CO[0] + 12, CO[1] + 10], "O", "#8338ec")
    + tx([M[0] - 14, M[1] + 14], "M", "#ff4f8b") + tx([(CO[0] + M[0]) / 2 + 12, (CO[1] + M[1]) / 2 + 2], "d", "#ff4f8b")
    + tx([120, 188], "MC = R − d,   MD = R + d", "#2ec4b6", 14)); };
const SA = [16, 110], SO = [168, 92], SR = 60;
FIG.secants = () => { const [B, C] = hits(SA, [SO[0], SO[1] - 28], SO, SR), [D, E] = hits(SA, [SO[0], SO[1] + 30], SO, SR);
  return svg(240, 170, fillC(SO, SR) + ln(SA, lerp(SA, C, 1.08), "#3a86ff", 3.5) + ln(SA, lerp(SA, E, 1.08), "#ff4f8b", 3.5)
    + [B, C, D, E].map(p => dot(p)).join("") + dot(SA) + tx([SA[0], SA[1] - 14], "A")
    + tx([B[0] - 4, B[1] - 14], "B", "#3a86ff") + tx([C[0] + 4, C[1] - 14], "C", "#3a86ff") + tx([D[0] - 2, D[1] + 16], "D", "#ff4f8b") + tx([E[0] + 6, E[1] + 16], "E", "#ff4f8b")); };
FIG.tangent = () => { const A = [16, 136], O = [165, 82], r = 60, B = touch(A, O, r, 1), [C, D] = hits(A, [O[0], O[1] + 18], O, r);
  return svg(240, 160, fillC(O, r) + ln(O, B, "#8338ec", 2.5, "5 4") + square(B, A, O, 10) + ln(A, lerp(A, B, 1.15), "#ff4f8b", 4) + ln(A, lerp(A, D, 1.06), "#3a86ff", 3.5)
    + [B, C, D].map(p => dot(p)).join("") + dot(A) + dot(O, "#8338ec") + tx([A[0] + 4, A[1] + 13], "A")
    + tx([B[0] - 16, B[1] + 4], "B", "#ff4f8b") + tx([C[0] - 2, C[1] + 16], "C", "#3a86ff") + tx([D[0] + 6, D[1] + 16], "D", "#3a86ff")); };
FIG.bis = () => { const A = [25, 135], B = [110, 25], C = [215, 135], D = lerp(B, C, 0.4225);
  return svg(240, 160, poly([A, B, C]) + ln(A, D, "#ff9f1c", 3.5) + arc(A, B, D, 26, "#2ec4b6") + arc(A, D, C, 32, "#2ec4b6")
    + tx([20, 150], "A") + tx([110, 12], "B") + tx([225, 150], "C") + tx([D[0] + 12, D[1] - 6], "D", "#ff9f1c")); };
FIG.inscribed = () => { const A = onC(CO, CR, 205), B = onC(CO, CR, -25), C = onC(CO, CR, 105);
  return svg(240, 186, `<g transform="translate(0,6)">` + fillC(CO, CR) + `<path d="M${A[0].toFixed(1)},${A[1].toFixed(1)} A${CR},${CR} 0 0 0 ${B[0].toFixed(1)},${B[1].toFixed(1)}" fill="none" stroke="#ff9f1c" stroke-width="7"/>`
    + ln(C, A, "#ff4f8b", 3) + ln(C, B, "#ff4f8b", 3) + ln(CO, A, "#3a86ff", 2.5, "5 4") + ln(CO, B, "#3a86ff", 2.5, "5 4")
    + arc(C, A, B, 22, "#ff4f8b") + arc(CO, A, B, 16, "#3a86ff") + [A, B, C].map(p => dot(p)).join("") + dot(CO, "#8338ec")
    + lab(CO, A, "A") + lab(CO, B, "B") + lab(CO, C, "C") + tx([C[0] + 2, C[1] + 34], "α", "#ff4f8b", 16) + tx([CO[0], CO[1] + 30], "2α", "#3a86ff", 15) + `</g>`); };
FIG.diam = () => { const A = onC(CO, CR, 180), B = onC(CO, CR, 0), C = onC(CO, CR, 60);
  return svg(240, 182, fillC(CO, CR) + ln(A, B, "#2ec4b6", 4) + poly([A, B, C], "none", "#ff4f8b") + square(C, A, B, 11) + dot(CO, "#8338ec")
    + lab(CO, A, "A") + lab(CO, B, "B") + lab(CO, C, "C") + tx([CO[0], CO[1] + 14], "O", "#8338ec") + tx([CO[0], 174], "AB — діаметр", "#2ec4b6", 13)); };

/* last five */
FIG.s27 = () => { const O = [160, 95], r = 50, K = [O[0] - 2 * r, 95], B = [O[0] - r, 95], C = [O[0] + r, 95], A = onC(O, r, 120);
  return svg(240, 160, fillC(O, r) + ln(K, C, "#3a86ff", 3) + ln(K, A, "#ff4f8b", 4) + ln(O, A, "#8338ec", 2.5, "5 4") + square(A, K, O, 9) + ln(A, C, "#2ec4b6", 3.5)
    + arc(A, K, C, 16, "#ff9f1c") + arc(K, A, C, 26, "#2b2350") + [K, A, B, C].map(p => dot(p)).join("") + dot(O, "#8338ec")
    + tx([K[0] - 4, K[1] + 16], "K") + tx([A[0] - 6, A[1] - 14], "A") + tx([B[0] - 6, B[1] + 16], "B") + tx([C[0] + 10, C[1] + 14], "C") + tx([O[0], O[1] + 16], "O", "#8338ec")
    + tx([(K[0] + B[0]) / 2, 82], "1", "#3a86ff") + tx([K[0] + 18, 64], "√3", "#ff4f8b") + tx([K[0] + 40, 88], "30°", "#2b2350", 12)); };
FIG.s28 = () => { const B = [20, 150], C = [190, 150], A = [190 + 120 * Math.cos(110 * Math.PI / 180), 150 - 120 * Math.sin(110 * Math.PI / 180)], M = mid(B, C);
  const [O, R] = circum(A, B, C), D = hits(A, M, O, R)[1];

function stepCard(p, id){
  return `<div class="card task" id="${id}" style="--c:${p.c || "#8338ec"}">
    <h3><span class="n">${p.n}</span>${p.idea ? "Задача" : "Типова задача"}</h3>
    <p class="tq">${p.q}</p>
    ${FIG[p.fig]()}
    ${p.idea ? `<div class="it mem"><b>💡</b><span><b>Ідея:</b> ${p.idea}</span></div>` : ""}
    <ol class="steps">${p.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    <div class="ansbox">✅ <b>Відповідь:</b> ${p.ans}</div>
    ${p.check ? `<div class="it check ${p.check.startsWith("⚠️") ? "fix" : "mem"}"><b>🔎</b><span>${p.check}</span></div>` : ""}
    <div class="row sbtn"><button class="btn light" onclick="stepAll('${id}')">📜 Показати все</button><button class="btn go" onclick="stepNext('${id}')">👣 Наступний крок</button></div>
  </div>`;
}
function stepNext(id){
  const card = document.getElementById(id), hidden = card.querySelector(".steps li:not(.on)");
  if (hidden) { hidden.classList.add("on"); }
  if (!card.querySelector(".steps li:not(.on)")) { card.classList.add("done"); }
}
function stepAll(id){
  const card = document.getElementById(id);
  card.querySelectorAll(".steps li").forEach(li => li.classList.add("on"));
  card.classList.add("done");
}
