<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Трикутники">
<meta name="theme-color" content="#fff8ef">
<title>Трикутники: формули — гра</title>
<style>
:root{
  --bg:#fff8ef; --card:#fff; --ink:#2b2350; --muted:#7a7399;
  --pink:#ff4f8b; --orange:#ff9f1c; --yellow:#ffd23f; --green:#2ec4b6; --lime:#7bd84a;
  --blue:#3a86ff; --violet:#8338ec; --red:#ef476f;
  --shadow:0 6px 0 rgba(43,35,80,.12), 0 12px 28px rgba(43,35,80,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 10% 0%,#ffe3f1 0,transparent 40%),radial-gradient(circle at 90% 10%,#dff3ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#e6ffe9 0,transparent 45%),var(--bg);
  min-height:100vh;-webkit-tap-highlight-color:transparent}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;max-width:820px;margin:0 auto}
h1{margin:0;font-size:24px;cursor:pointer}
h1 .acc{color:var(--pink)}
.home{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;font-size:22px;flex:none}
.stats{display:flex;gap:8px;margin-left:auto}
.pill{background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;box-shadow:var(--shadow);font-size:15px}
.bar{max-width:820px;margin:0 auto;padding:0 16px}
.progress{height:12px;background:#ece6ff;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--lime),var(--green));transition:width .5s}
.progress-label{font-size:13px;color:var(--muted);margin-top:4px}
main{max-width:820px;margin:0 auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:17px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;box-shadow:var(--shadow)}
.btn.light{background:#fff;color:var(--ink)}
.btn.go{background:var(--green)}
.btn.pink{background:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.row .btn{flex:1;min-width:130px}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lvl{position:relative;display:flex;gap:12px;align-items:center;border:0;text-align:left;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;cursor:pointer;color:var(--ink);font:inherit;border-left:10px solid var(--c)}
.lvl .em{font-size:34px}
.lvl .nm{font-weight:800;font-size:17px}
.lvl .st{font-size:18px;margin-top:4px;letter-spacing:2px}
.lvl .n{font-size:13px;color:var(--muted)}
.lvl.locked{opacity:.55;filter:grayscale(.6)}
.lvl .num{position:absolute;top:8px;right:12px;font-weight:800;color:var(--c)}
.intro{font-size:16px;line-height:1.45}
/* slide */
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.slide h2{margin:10px 0 8px;font-size:22px}
.formula{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(22px,6.4vw,34px);text-align:center;background:#f6f2ff;border:3px dashed var(--c);border-radius:18px;padding:14px 8px;margin:10px 0;line-height:1.5}
.formula .line{display:block}
.fig{display:block;width:100%;max-width:340px;margin:6px auto;height:auto}
.box{border-radius:16px;padding:10px 14px;margin:10px 0;font-size:16px;line-height:1.45}
.box.mem{background:#fff4d6}
.box.use{background:#e5f8f5}
.box.fix{background:#ffe3ea;border:2px solid var(--red)}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#e2dcf5}
.dots i.on{background:var(--c)}
/* math */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}
.rt{white-space:nowrap}
.rt>span{border-top:2px solid currentColor;padding:0 2px;margin-left:1px}
.m{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
/* quiz */
.q{font-size:19px;font-weight:700;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:3px solid #e2dcf5;background:#fff;border-radius:18px;padding:12px;font-size:19px;cursor:pointer;color:var(--ink);text-align:center;min-height:60px;font-family:"Cambria Math","STIX Two Math","Segoe UI",system-ui,serif;position:relative}
.opt .k{position:absolute;left:8px;top:6px;font:700 12px system-ui;color:var(--muted)}
.opt.ok{border-color:var(--green);background:#d9fbf2;animation:okflash .6s}
.opt.bad{border-color:var(--red);background:#ffdbe4;animation:shake .35s}
.opt:disabled{cursor:default}
.explain{margin-top:12px}
.hearts{font-size:20px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes okflash{0%{transform:scale(1.04)}100%{transform:scale(1)}}
/* result */
.big{font-size:64px;text-align:center;margin:6px 0}
.center{text-align:center}
/* cheat */
.cheat h3{margin:14px 0 6px;color:var(--c)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0;flex-wrap:wrap}
.ch .t{font-size:15px;color:var(--muted);flex:1;min-width:140px}
.ch .f{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:20px;cursor:pointer}
.hide .ch .f{background:#ece6ff;color:transparent;border-radius:10px}
.hide .ch .f *{border-color:transparent!important}
.hide .ch .f.show{background:none;color:var(--ink)}
.hide .ch .f.show *{border-color:currentColor!important}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
svg text{font-family:"Segoe UI",system-ui,sans-serif;font-weight:700;font-size:15px;fill:#2b2350}
</style>
</head>
<body>
<header>
  <a class="home" href="../" title="Усі ігри">🏠</a>
  <h1 onclick="showMap()">🔺 <span class="acc">Трикутники</span></h1>
  <div class="stats"><span class="pill" id="stars">⭐ 0</span><span class="pill" id="xp">⚡ 0</span></div>
</header>
<div class="bar"><div class="progress"><div id="pbar" style="width:0"></div></div><div class="progress-label" id="plabel"></div></div>
<main id="app"></main>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>
<script>
"use strict";
const SLUG = "triangles";
const KEY = SLUG + "_v1";

/* ---------- math helpers ---------- */
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const rt = x => `<span class="rt">√<span>${x}</span></span>`;
const L = (...lines) => lines.map(l => `<span class="line">${l}</span>`).join("");

/* ---------- svg helpers ---------- */
const P = pts => pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ");
const svg = (w, h, body) => `<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const poly = (pts, fill = "#fff3c4", stroke = "#2b2350") => `<polygon points="${P(pts)}" fill="${fill}" stroke="${stroke}" stroke-width="3" stroke-linejoin="round"/>`;
const ln = (a, b, col = "#2b2350", w = 3, dash = "") => `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ""} stroke-linecap="round"/>`;
const tx = (p, s, col = "#2b2350", size = 15) => `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" style="fill:${col};font-size:${size}px">${s}</text>`;
const cir = (c, r, col = "#8338ec", fill = "none", dash = "") => `<circle cx="${c[0]}" cy="${c[1]}" r="${r}" stroke="${col}" stroke-width="2.5" fill="${fill}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
const dot = (p, col = "#2b2350") => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}"/>`;
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function arc(v, a, b, r = 22, col = "#ff4f8b"){
  const u = lerp(v, a, r / dist(v, a)), w = lerp(v, b, r / dist(v, b));
  const cross = (a[0] - v[0]) * (b[1] - v[1]) - (a[1] - v[1]) * (b[0] - v[0]);
  return `<path d="M${u[0].toFixed(1)},${u[1].toFixed(1)} A${r},${r} 0 0 ${cross > 0 ? 1 : 0} ${w[0].toFixed(1)},${w[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="3"/>`;
}
function square(v, a, b, s = 12){
  const u = lerp(v, a, s / dist(v, a)), w = lerp(v, b, s / dist(v, b));
  const c = [u[0] + w[0] - v[0], u[1] + w[1] - v[1]];
  return `<polyline points="${P([u, c, w])}" fill="none" stroke="#2b2350" stroke-width="2"/>`;
}
function tick(a, b, n = 1, col = "#2b2350"){
  const m = mid(a, b), d = dist(a, b), ux = (b[0] - a[0]) / d, uy = (b[1] - a[1]) / d;
  let s = "";
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 6, c = [m[0] + ux * off, m[1] + uy * off];
    s += ln([c[0] - uy * 7, c[1] + ux * 7], [c[0] + uy * 7, c[1] - ux * 7], col, 2.5);
  }
  return s;
}
function incircle(A, B, C){
  const a = dist(B, C), b = dist(C, A), c = dist(A, B), p = a + b + c;
  const I = [(a * A[0] + b * B[0] + c * C[0]) / p, (a * A[1] + b * B[1] + c * C[1]) / p];
  const s = Math.abs((B[0] - A[0]) * (C[1] - A[1]) - (C[0] - A[0]) * (B[1] - A[1])) / 2;
  return [I, 2 * s / p];
}
function foot(P0, A, B){
  const dx = B[0] - A[0], dy = B[1] - A[1], t = ((P0[0] - A[0]) * dx + (P0[1] - A[1]) * dy) / (dx * dx + dy * dy);
  return [A[0] + t * dx, A[1] + t * dy];
}

/* ---------- figures ---------- */
const FIG = {};
FIG.tri = () => { const A = [30, 135], B = [210, 135], C = [95, 25];
  return svg(240, 160, poly([A, B, C]) + tx([120, 152], "c", "#ff4f8b") + tx([50, 75], "a", "#3a86ff") + tx([165, 75], "b", "#2ec4b6")); };
FIG.kinds = () => {
  const t1 = [[10, 110], [90, 110], [55, 30]], t2 = [[115, 110], [195, 110], [115, 40]], t3 = [[210, 110], [300, 110], [228, 72]];
  return svg(310, 140, poly(t1, "#d9fbf2") + poly(t2, "#fff3c4") + poly(t3, "#ffdbe4") + square(t2[0], t2[1], t2[2])
    + arc(t3[0], t3[1], t3[2], 14) + tx([50, 130], "гострий", "#2b2350", 13) + tx([155, 130], "прямий", "#2b2350", 13) + tx([255, 130], "тупий", "#2b2350", 13)); };
FIG.median = () => { const A = [25, 135], B = [215, 135], C = [90, 25], M = mid(A, B);
  return svg(240, 160, poly([A, M, C], "#d9fbf2") + poly([M, B, C], "#ffe3f1") + ln(C, M, "#8338ec", 3.5) + tick(A, M, 1) + tick(M, B, 1)
    + tx([25, 150], "A") + tx([215, 150], "B") + tx([90, 13], "C") + tx([120, 150], "M") + tx([118, 85], "m", "#8338ec")
    + tx([70, 118], "S", "#2b2350", 14) + tx([160, 118], "S", "#2b2350", 14)); };
FIG.bis = () => { const A = [25, 135], B = [110, 25], C = [215, 135], D = lerp(B, C, 0.4225);
  return svg(240, 160, poly([A, B, C]) + ln(A, D, "#ff4f8b", 3.5) + arc(A, B, D, 26, "#2ec4b6") + arc(A, D, C, 32, "#2ec4b6")
    + tx([20, 150], "A") + tx([110, 12], "B") + tx([225, 150], "C") + tx([D[0] + 12, D[1] - 6], "D", "#ff4f8b")); };
FIG.cos = () => { const A = [30, 135], B = [120, 25], C = [215, 135];
  return svg(240, 160, poly([A, B, C]) + arc(A, B, C, 26) + ln(B, C, "#3a86ff", 5)
    + tx([22, 150], "A") + tx([120, 12], "B") + tx([225, 150], "C") + tx([60, 125], "∠A", "#ff4f8b", 13)
    + tx([62, 75], "c") + tx([122, 152], "b") + tx([182, 72], "a", "#3a86ff")); };
FIG.sin = () => { const O = [120, 85], A = [63.7, 117.5], B = [131.3, 21], C = [181.1, 107.2];
  return svg(240, 170, cir(O, 65) + poly([A, B, C]) + dot(O, "#8338ec") + ln(O, C, "#8338ec", 2.5, "5 4")
    + tx([52, 125], "A") + tx([133, 9], "B") + tx([194, 113], "C") + tx([153, 87], "R", "#8338ec") + tx([110, 87], "O", "#8338ec")); };
FIG.areaH = () => { const A = [25, 135], C = [215, 135], B = [80, 30], H = [80, 135];
  return svg(240, 160, poly([A, C, B]) + ln(B, H, "#ff4f8b", 3, "6 4") + square(H, C, B, 10)
    + tx([90, 88], "h", "#ff4f8b") + tx([120, 152], "a", "#3a86ff")); };
FIG.areaSin = () => { const C = [30, 135], A = [215, 135], B = [110, 30];
  return svg(240, 160, poly([C, A, B]) + arc(C, A, B, 30) + tx([72, 122], "γ", "#ff4f8b", 17)
    + tx([120, 152], "a", "#3a86ff") + tx([58, 78], "b", "#2ec4b6")); };
FIG.heron = () => { const A = [30, 130], B = [210, 130], C = [95, 25];
  return svg(240, 175, poly([A, B, C]) + tx([120, 146], "c") + tx([50, 72], "a") + tx([165, 72], "b")
    + tx([120, 166], "p = (a + b + c) : 2", "#8338ec", 14)); };
FIG.inR = () => { const A = [20, 140], B = [220, 140], C = [85, 20], [I, r] = incircle(A, B, C), T = [I[0], 140];
  return svg(240, 160, poly([A, B, C]) + cir(I, r, "#2ec4b6", "#e5f8f5") + ln(I, T, "#2ec4b6", 2.5) + dot(I, "#2ec4b6") + tx([I[0] + 10, I[1] + 20], "r", "#2ec4b6")); };
FIG.outR = FIG.sin;
const RT = { A: [40, 20], C: [40, 140], B: [220, 140] };
FIG.right = () => { const { A, B, C } = RT;
  return svg(260, 165, poly([A, B, C]) + square(C, A, B) + arc(A, C, B, 24)
    + ln(A, B, "#8338ec", 5) + ln(C, B, "#ff4f8b", 5) + ln(A, C, "#3a86ff", 5)
    + tx([30, 14], "A") + tx([30, 150], "C") + tx([232, 150], "B")
    + `<text x="148" y="74" transform="rotate(33.7 148 74)" text-anchor="middle" style="fill:#8338ec;font-size:13px">гіпотенуза</text>` + tx([130, 157], "протилежний до ∠A", "#ff4f8b", 12)
    + `<text x="18" y="80" transform="rotate(-90 18 80)" text-anchor="middle" style="fill:#3a86ff;font-size:12px">прилеглий</text>`); };
FIG.rightPlain = () => { const { A, B, C } = RT;
  return svg(260, 165, poly([A, B, C]) + square(C, A, B) + ln(A, B, "#8338ec", 5)
    + tx([28, 85], "b", "#3a86ff") + tx([130, 157], "a", "#ff4f8b") + tx([140, 68], "c", "#8338ec")
    + tx([180, 40], "a² + b² = c²", "#2b2350", 14)); };
FIG.metric = () => { const { A, B, C } = RT, K = foot(C, A, B);
  return svg(260, 165, poly([A, B, C]) + square(C, A, B) + ln(C, K, "#ff4f8b", 3) + square(K, B, C, 9)
    + tx([30, 14], "A") + tx([30, 150], "C") + tx([232, 150], "B") + tx([K[0] + 10, K[1] - 10], "K", "#ff4f8b")
    + tx(mid(A, K).map((v, i) => v + (i ? -8 : 10)), "AK", "#3a86ff", 12) + tx(mid(K, B).map((v, i) => v + (i ? -8 : 10)), "KB", "#2ec4b6", 12)); };
FIG.rightIn = () => { const { A, B, C } = RT, [I, r] = incircle(A, B, C);
  return svg(260, 165, poly([A, B, C]) + square(C, A, B) + cir(I, r, "#2ec4b6", "#e5f8f5") + dot(I, "#2ec4b6") + ln(I, [I[0], 140], "#2ec4b6", 2.5)
    + tx([I[0] + 9, I[1] + 18], "r", "#2ec4b6") + tx([28, 85], "b") + tx([130, 155], "a") + tx([140, 70], "c", "#8338ec")); };
FIG.rightOut = () => { const A = [50, 50], B = [190, 130], C = [50, 130], O = mid(A, B), R = dist(O, A);
  return svg(240, 180, cir(O, R) + poly([A, B, C]) + square(C, A, B) + ln(C, O, "#ff4f8b", 3, "6 4") + dot(O, "#8338ec")
    + tx([O[0] + 8, O[1] - 14], "O", "#8338ec") + tx([40, 40], "A") + tx([202, 140], "B") + tx([40, 142], "C")
    + tx([80, 100], "m", "#ff4f8b")); };
FIG.eq = () => { const A = [45, 165], B = [195, 165], C = [120, 165 - 75 * Math.sqrt(3)], O = [120, 165 - 25 * Math.sqrt(3)];
  const R = dist(O, A), r = 165 - O[1];
  return svg(240, 215, cir(O, R, "#8338ec", "none", "6 4") + poly([A, B, C], "#fff3c4") + cir(O, r, "#2ec4b6", "#e5f8f5")
    + ln(C, [120, 165], "#ff4f8b", 2.5, "5 4") + dot(O) + ln(O, B, "#8338ec", 2.5)
    + tick(A, B) + tick(B, C) + tick(C, A) + tx([110, 145], "r", "#2ec4b6") + tx([162, 133], "R", "#8338ec") + tx([130, 85], "h", "#ff4f8b")); };
function pair(kind){
  const T = [[0, 110], [110, 110], [30, 30]];
  const at = (dx) => T.map(p => [p[0] + dx + 10, p[1]]);
  const one = (pts) => {
    let s = poly(pts, "#fff");
    const side = (i, j, n) => ln(pts[i], pts[j], "#ff4f8b", 5) + tick(pts[i], pts[j], n, "#ff4f8b");
    if (kind === 1) { s += side(0, 1, 1) + side(0, 2, 2) + arc(pts[0], pts[1], pts[2], 20, "#3a86ff"); }
    if (kind === 2) { s += side(0, 1, 1) + arc(pts[0], pts[1], pts[2], 20, "#3a86ff") + arc(pts[1], pts[0], pts[2], 20, "#2ec4b6"); }
    if (kind === 3) { s += side(0, 1, 1) + side(0, 2, 2) + side(1, 2, 3); }
    return s;
  };
  return svg(260, 125, one(at(0)) + one(at(130)) + tx([125, 75], "=", "#2b2350", 26));
}
FIG.eq1 = () => pair(1); FIG.eq2 = () => pair(2); FIG.eq3 = () => pair(3);
FIG.sim = () => { const s = [[10, 90], [80, 90], [30, 40]], k = 1.6, b = s.map(p => [130 + (p[0] - 10) * k, 150 - (90 - p[1]) * k]);
  return svg(260, 170, poly(s, "#d9fbf2") + poly(b, "#ffe3f1") + arc(s[0], s[1], s[2], 14) + arc(b[0], b[1], b[2], 20)
    + tx([4, 102], "K") + tx([88, 102], "M") + tx([30, 28], "N") + tx([124, 162], "P") + tx([250, 162], "Q") + tx([162, 56], "R")
    + tx([150, 18], "k = більший : менший", "#8338ec", 12)); };

/* ---------- content ---------- */
const LEVELS = [
 { id: "any", name: "Будь-який трикутник", em: "🔺", c: "#ff4f8b",
   intro: "Почнемо з простого: коли трикутник взагалі існує і як дізнатися, гострий він, прямий чи тупий.",
   slides: [
    { f: "ineq", t: "Нерівність трикутника", fig: "tri",
      fm: L("a + b > c"),

 { id: "theorems", name: "Теореми косинусів і синусів", em: "⚖️", c: "#3a86ff",

/* ---------- state ---------- */
function fresh(){ return { box: {}, proved: {}, fail: {}, miss: {}, stars: {}, xp: 0 }; }
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
catch (e) { console.warn("Progress was broken, starting fresh", e); S = fresh(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); hud(); }
function learned(f){ return (S.box[f] || 0) >= 4 && S.proved[f] && !S.fail[f]; }
function hud(){
  const st = Object.values(S.stars).reduce((a, b) => a + b, 0);
  document.getElementById("stars").textContent = `⭐ ${st}`;
  document.getElementById("xp").textContent = `⚡ ${S.xp}`;
  const n = FORMULAS.filter(f => learned(f.f)).length;
  document.getElementById("pbar").style.width = (100 * n / FORMULAS.length) + "%";
  document.getElementById("plabel").textContent = `Вивчено формул: ${n} з ${FORMULAS.length} (щоб формула стала вивченою, пройди її в рівні і в Босі)`;
}
function mark(f, ok, boss){
  if (ok) {
    S.box[f] = Math.min(5, (S.box[f] || 0) + 1); delete S.fail[f]; S.xp += 10;
    if (boss) { S.proved[f] = true; }
  } else {
    S.box[f] = Math.max(0, (S.box[f] || 0) - 1); S.fail[f] = true;
  }
  save();
}

function drawIcon(px, r){
  const c = document.createElement("canvas"); c.width = c.height = px;
  const x = c.getContext("2d"); x.scale(px / 100, px / 100);
  const bg = x.createLinearGradient(0, 0, 100, 100);
  ["#ff4f8b", "#ff9f1c", "#ffd23f", "#2ec4b6"].forEach((col, k) => bg.addColorStop(k / 3, col));
  x.fillStyle = bg; x.beginPath(); x.roundRect(0, 0, 100, 100, r); x.fill();
  x.save(); x.translate(50, 52); x.rotate(-6 * Math.PI / 180);
  x.shadowColor = "rgba(60,20,80,.35)"; x.shadowBlur = 6; x.shadowOffsetY = 3;
  x.fillStyle = "#fff"; x.beginPath(); x.roundRect(-27, -33, 54, 66, 10); x.fill();
  x.shadowColor = "transparent";
  x.font = "34px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("📐", 0, -5);
  x.fillStyle = "#eee6f5"; x.beginPath(); x.roundRect(-18, 18, 36, 6, 3); x.fill();
  x.fillStyle = "#ff4f8b"; x.beginPath(); x.roundRect(-18, 18, 26, 6, 3); x.fill();
  x.restore();
  x.fillStyle = "#fff"; x.font = "bold 20px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("✦", 84, 15);
  return c.toDataURL("image/png");
}

const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
let parts = [];
function resize(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", resize); resize();
function confetti(n = 60){
  const cols = ["#ff4f8b","#ff9f1c","#ffd23f","#2ec4b6","#3a86ff","#8338ec","#7bd84a"];
  for (let i = 0; i < n; i++) {
    parts.push({x:innerWidth/2, y:innerHeight/2.4, vx:(Math.random()-.5)*16, vy:Math.random()*-14-4, s:Math.random()*8+5, c:cols[i%cols.length], r:Math.random()*6, life:90});
  }
  if (parts.length === n) { requestAnimationFrame(tickFx); }
}
function tickFx(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.r += .2; p.life--; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  parts = parts.filter(p => p.life > 0);
  if (parts.length) { requestAnimationFrame(tickFx); } else { ctx.clearRect(0,0,fx.width,fx.height); }
}
let audio;
function beep(ok){
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") { audio.resume(); }
    (ok ? [660, 880] : [220, 160]).forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      g.gain.setValueAtTime(.12, audio.currentTime + i*.09);
      g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + i*.09 + .18);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + i*.09); o.stop(audio.currentTime + i*.09 + .2);
    });
  } catch (e) { console.warn("Sound is not available", e); }
}
let toastT;
function toast(s){ const t = document.getElementById("toast"); t.textContent = s; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1400); }
const PRAISE = ["Супер! 🎉", "Так тримати! 💪", "Чудово! ✨", "Правильно! 🔥", "Молодець! 🌟"];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- screens ---------- */
const app = document.getElementById("app");
let keyHandler = null;
addEventListener("keydown", e => { if (keyHandler) { keyHandler(e); } });
function go(html){ keyHandler = null; app.innerHTML = html; scrollTo(0, 0); if (document.activeElement) { document.activeElement.blur(); } }
const unlocked = i => i === 0 || (S.stars[LEVELS[i - 1].id] || 0) > 0;
const allDone = () => LEVELS.every(l => (S.stars[l.id] || 0) > 0);
const starStr = n => "⭐".repeat(n) + "☆".repeat(3 - n);

function showMap(){
  const lv = LEVELS.map((l, i) => {
    const ok = unlocked(i);
    return `<button class="lvl ${ok ? "" : "locked"}" style="--c:${l.c}" onclick="${ok ? `startLevel(${i})` : `toast('Спочатку пройди рівень ${i}')`}">
      <span class="num">${i + 1}</span><span class="em">${ok ? l.em : "🔒"}</span>
      <span><div class="nm">${l.name}</div><div class="n">${l.slides.length} ${l.slides.length < 5 ? "формули" : "формул"} · ${l.quiz.length} питань</div><div class="st">${starStr(S.stars[l.id] || 0)}</div></span></button>`;
  }).join("");
  const boss = allDone();
  go(`<div class="card intro">Привіт! 👋 Спочатку можна прочитати 📖 <a href="theory.html">Теорію</a>. Тут 7 рівнів. У кожному спочатку <b>картки з формулами</b> (з малюнком і підказкою, як запам'ятати), потім <b>тест</b>.
    За тест отримуєш до 3 ⭐. Пройдеш рівень — відкриється наступний. В кінці — 👑 <b>Бос</b>: «яку формулу взяти для задачі?».</div>
    <div class="map">${lv}
      <button class="lvl ${boss ? "" : "locked"}" style="--c:#ffd23f" onclick="${boss ? "startBoss()" : "toast('Бос відкриється після всіх 7 рівнів')"}">
        <span class="em">${boss ? "👑" : "🔒"}</span><span><div class="nm">Бос: яка формула?</div><div class="n">12 питань з усіх тем, 3 ❤️</div><div class="st">${S.stars.boss ? starStr(S.stars.boss) : ""}</div></span></button>
      <a class="lvl" style="--c:#3a86ff;text-decoration:none" href="theory.html"><span class="em">📖</span><span><div class="nm">Теорія</div><div class="n">усі формули з малюнками і прикладами</div></span></a>
      <button class="lvl" style="--c:#7a7399" onclick="showCheat()"><span class="em">📋</span><span><div class="nm">Шпаргалка</div><div class="n">усі формули + самоперевірка</div></span></button>
    </div>
    <p class="center"><button class="btn light" onclick="resetAll()">🗑️ Стерти прогрес</button></p>`);
}
function resetAll(){ if (confirm("Стерти весь прогрес і зірки?")) { S = fresh(); save(); showMap(); } }

let cur = 0, slide = 0;
function startLevel(i){ cur = i; slide = 0; showSlide(); }
function showSlide(){
  const l = LEVELS[cur], s = l.slides[slide], last = slide === l.slides.length - 1;
  const dots = l.slides.map((_, k) => `<i class="${k <= slide ? "on" : ""}"></i>`).join("");
  go(`<div class="card slide" style="--c:${l.c}">
      <span class="tag">${l.em} Рівень ${cur + 1} · картка ${slide + 1} з ${l.slides.length}</span>
      ${slide === 0 ? `<p class="intro">${l.intro}</p>` : ""}
      <h2>${s.t}</h2>
      ${FIG[s.fig]()}
      <div class="formula">${s.fm}</div>
      <div class="box mem">🧠 <b>Як запам'ятати:</b> ${s.mem}</div>
      <div class="box use">🎯 <b>Коли брати:</b> ${s.use}</div>
      ${s.fix ? `<div class="box fix">⚠️ <b>Увага (конспект):</b> ${s.fix}</div>` : ""}
      <div class="dots">${dots}</div>
      <div class="row">
        <button class="btn light" onclick="${slide ? "slide--;showSlide()" : "showMap()"}">← ${slide ? "Назад" : "Карта"}</button>
        <button class="btn ${last ? "pink" : "go"}" onclick="${last ? `startQuiz(${cur})` : "slide++;showSlide()"}">${last ? "Почати тест ▶" : "Далі →"}</button>
      </div></div>`);
  keyHandler = e => {
    if (e.key === "ArrowRight" || e.key === "Enter") { if (last) { startQuiz(cur); } else { slide++; showSlide(); } }
    if (e.key === "ArrowLeft" && slide) { slide--; showSlide(); }
  };
}

/* quiz engine: used by levels and boss */
let Q = null;
function startQuiz(i){
  const l = LEVELS[i];
  Q = { level: i, c: l.c, title: `${l.em} ${l.name}`, list: shuffle(l.quiz), pos: 0, wrong: 0, retried: new Set(), boss: false };
  ask();
}
function startBoss(){
  const all = [];
  LEVELS.forEach(l => l.quiz.forEach(q => all.push(Object.assign({ c: l.c }, q))));
  const rank = q => S.fail[q.f] ? 0 : !S.proved[q.f] ? 1 : 2 + (S.box[q.f] || 0);
  const tasks = shuffle(all).sort((a, b) => rank(a) - rank(b)).slice(0, 12);
  Q = { level: -1, c: "#ffb703", title: "👑 Бос: яка формула?", list: shuffle(tasks), pos: 0, wrong: 0, retried: new Set(), boss: true, hearts: 3, total: tasks.length };
  ask();
}
function ask(){
  const q = Q.list[Q.pos];
  const opts = shuffle(q.o.map((t, k) => ({ t, ok: k === 0 })));
  const head = Q.boss ? `<span class="hearts">${"❤️".repeat(Q.hearts)}${"🤍".repeat(3 - Q.hearts)}</span>` : "";
  const total = Q.boss ? Q.total : Q.list.length;
  go(`<div class="card" style="--c:${q.c || Q.c}">
      <div class="row"><span class="tag" style="background:${Q.c}">${Q.title} · ${Math.min(Q.pos + 1, total)}/${total}</span>${head}</div>
      ${q.fig ? FIG[q.fig]() : ""}
      <p class="q">${q.q}</p>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-ok="${o.ok ? 1 : 0}"><span class="k">${k + 1}</span>${o.t}</button>`).join("")}</div>
      <div id="after"></div></div>
      <p class="center"><button class="btn light" onclick="showMap()">← Карта</button></p>`);
  const btns = [...app.querySelectorAll(".opt")];
  let done = false;
  const pick = b => {
    if (done) { return; }
    done = true;
    const ok = b.dataset.ok === "1";
    btns.forEach(x => { x.disabled = true; if (x.dataset.ok === "1") { x.classList.add("ok"); } });
    beep(ok);
    if (!ok) {
      b.classList.add("bad"); Q.wrong++;
      if (Q.boss) { Q.hearts--; }
      else if (!Q.retried.has(q)) { Q.retried.add(q); Q.list.push(q); }
    } else { toast(PRAISE[Math.floor(Math.random() * PRAISE.length)]); }
    mark(q.f, ok, Q.boss);
    const end = Q.boss && Q.hearts === 0;
    document.getElementById("after").innerHTML = `<div class="box ${ok ? "use" : "fix"} explain">${ok ? "✅" : "❌"} ${q.e}${!ok && !Q.boss ? "<br><i>Це питання повториться в кінці.</i>" : ""}</div>
      <button class="btn go" style="width:100%" id="next">${end ? "Ой, серця закінчились 💔" : "Далі (Enter) →"}</button>`;
    const next = () => { Q.pos++; if (end || Q.pos >= Q.list.length) { result(); } else { ask(); } };
    document.getElementById("next").onclick = next;
    keyHandler = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); } };
  };
  btns.forEach(b => b.onclick = () => pick(b));
  keyHandler = e => { const n = +e.key; if (n >= 1 && n <= btns.length) { pick(btns[n - 1]); } };
}
function result(){
  let stars;
  if (Q.boss) { stars = Q.hearts === 0 ? 0 : Q.wrong === 0 ? 3 : Q.wrong === 1 ? 2 : 1; }
  else { stars = Q.wrong === 0 ? 3 : Q.wrong <= 2 ? 2 : 1; }
  const id = Q.boss ? "boss" : LEVELS[Q.level].id, before = S.stars[id] || 0;
  S.stars[id] = Math.max(before, stars); save();
  if (stars) { confetti(stars * 50); }
  const nextLvl = !Q.boss && Q.level + 1 < LEVELS.length ? Q.level + 1 : null;
  const msg = Q.boss
    ? (stars ? (stars === 3 ? "Ти перемогла Боса без жодної помилки! 👑" : "Бос переможений! 🎉") : "Бос поки сильніший. Повтори шпаргалку і спробуй ще!")
    : (stars === 3 ? "Ідеально, без помилок!" : stars === 2 ? "Дуже добре!" : "Рівень пройдено! Спробуй ще раз на 3 ⭐.");
  const replay = Q.boss ? "startBoss()" : `startQuiz(${Q.level})`;
  go(`<div class="card center" style="--c:${Q.c}">
      <div class="big">${stars ? starStr(stars) : "💔"}</div>
      <h2>${msg}</h2>
      <p>Помилок: <b>${Q.wrong}</b>${before > stars ? ` · твій рекорд: ${starStr(before)}` : ""}</p>
      <div class="row">
        <button class="btn light" onclick="${replay}">🔁 Ще раз</button>
        ${!Q.boss ? `<button class="btn light" onclick="startLevel(${Q.level})">📖 Картки</button>` : ""}
        ${nextLvl !== null ? `<button class="btn go" onclick="startLevel(${nextLvl})">Рівень ${nextLvl + 1} →</button>`
          : `<button class="btn go" onclick="showMap()">🗺️ Карта</button>`}
      </div></div>`);
}

function showCheat(){
  const body = LEVELS.map(l => `<h3 style="--c:${l.c}">${l.em} ${l.name}</h3>` + l.slides.map(s =>
    `<div class="ch"><span class="t">${s.t}</span><span class="f" onclick="this.classList.toggle('show')">${s.fm.replace(/class="line"/g, 'class="line" style="display:block"')}</span></div>`).join("")).join("");
  go(`<div class="card cheat" id="cheat">
      <div class="row"><h2 style="margin:0">📋 Шпаргалка</h2>
      <button class="btn pink" style="flex:none" onclick="toggleHide(this)">🙈 Сховати формули</button></div>
      <p class="n" style="color:var(--muted)">Сховай формули і перевір себе: скажи формулу вголос, потім торкнись, щоб побачити.</p>
      ${body}</div>
      <p class="center"><button class="btn light" onclick="showMap()">← Карта</button></p>`);
}
function toggleHide(b){
  const c = document.getElementById("cheat"), h = c.classList.toggle("hide");
  c.querySelectorAll(".f.show").forEach(x => x.classList.remove("show"));
  b.textContent = h ? "👀 Показати всі" : "🙈 Сховати формули";
}

hud();
const hashQuiz = location.hash.match(/^#quiz=(\d)$/);
if (hashQuiz && LEVELS[+hashQuiz[1]]) { history.replaceState(null, "", location.pathname); startQuiz(+hashQuiz[1]); } else { showMap(); }
</script>
